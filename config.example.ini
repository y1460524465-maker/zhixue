# ============================================================
# 智学 / Itcast_qa_system 配置示例
# 用法：复制成 config.ini 后再填自己的值  ->  copy config.example.ini config.ini
# config.ini 已被 .gitignore 排除，不会提交到仓库。
# ============================================================

# MySQL 配置
[mysql]
host = localhost
user = root
password = 请填写你的 MySQL 密码
database = subjects_kg

# Redis 配置
[redis]
host = localhost
port = 6379
password =
db = 0

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag_0421

# LLM 配置（阿里云百炼 DashScope，OpenAI 兼容接口）
[llm]
model = qwen3-max
dashscope_api_key = 请填写你的 DashScope API Key
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 日志配置
[logger]
log_file = logs/app.log

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678

# ============================================================
# 智学（新系统）覆盖配置
# 留空的项会自动回落到上面的 [mysql] / [redis] / [milvus] / [llm]
# 这样智学可以独立配置，又不需要改动原项目的配置。
# ============================================================
[zhixue]
mysql_password = 请填写你的 MySQL 密码
# 智学使用独立的业务库，不影响原项目的 subjects_kg
mysql_database = zhixue
# Agent 调工具的方式：mcp（走真实 MCP 协议）/ local（进程内直调）
tool_transport = mcp
# 主应用派发任务的方式：a2a（走真实 A2A 协议）/ local（进程内直调）
network_transport = a2a
